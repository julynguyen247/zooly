syntax = "proto3";

package testset;

service TestsetService {
  rpc CheckAnswer (CheckAnswerRequest) returns (CheckAnswerResponse);
}

enum Part {
  PART_UNSPECIFIED = 0; 
  READING = 1;
  LISTENING = 2;
}

message CheckAnswerRequest {
  string questionId = 1;
  string choiceId = 2;  
  string userAnswer = 3; 
}

message CheckAnswerResponse {
  bool correct = 1;          
  Part part = 2;            
  string explanation = 3;    
  string correctChoiceId = 4;
}
